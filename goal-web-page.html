<!-- biome-ignore-file -->
<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Analytics & AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
  font-family: "Inter", sans-serif;
}
.scrollbar-hide::-webkit-scrollbar {
  width: 0;
  height: 0;
}
  </style>
</head>
  <body class="bg-[#0b0c15] text-white">
    <div id="root"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/react@18.0.0/umd/react.development.js"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/react-dom@18.0.0/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
    "use strict";
const SidebarItem = ({label, active = false, icon = "cube", caret = false, children}) => {
      const [isOpen, setIsOpen] = React.useState(true);
      return (
        <div className="mb-1">
          <div 
            onClick={() => setIsOpen(!isOpen)}
            className={`flex items-center gap-2 py-2 pl-3 pr-3 rounded-md cursor-pointer ${active ? 'bg-[#3a2a59]' : 'hover:bg-[#1a1d2b]'}`}
          >
            <i className={`fas fa-$icontext-xs text-[#9aa0b4]`}></i>
            <span className="text-sm text-[#d8dbe6] truncate">{label}</span>
            {caret && <i className={`fas fa-chevron-$isOpen ? 'down' : 'right'text-[10px] text-[#5c5f73] ml-auto`}></i>}
          </div>
          {isOpen && children && <div className="ml-2 border-l border-[#242739] pl-2">{children}</div>}
        </div>
      );
    };

    const App = () => {
      const [leftSidebarOpen, setLeftSidebarOpen] = React.useState(true);
      const [rightSidebarOpen, setRightSidebarOpen] = React.useState(true);

      return (
        <div className="h-screen w-screen flex bg-[#0b0c15] overflow-hidden">
          {/* Left Sidebar */}
          {leftSidebarOpen && (
            <aside className="w-[280px] border-r border-[#1b1e2d] bg-[#0c0d17] flex flex-col shrink-0 relative">
              <div className="flex items-center gap-2 px-5 py-5">
                <div className="relative w-6 h-6">
                  <span className="absolute w-3 h-3 bg-[#c029d6] skew-x-[-20deg] -left-0"></span>
                  <span className="absolute w-3 h-3 bg-[#8b2dff] skew-x-[-20deg] left-2 top-2"></span>
                  <span className="absolute w-3 h-3 bg-[#ff4da6] skew-x-[-20deg] left-1 top-4"></span>
                </div>
                <div className="text-sm font-semibold">Data Analytics &amp; AI</div>
              </div>

              <button 
                onClick={() => setLeftSidebarOpen(false)}
                className="absolute right-0 top-10 translate-x-1/2 z-20 bg-[#0b0c15]/60 p-1 text-[#5c5f73] hover:text-white"
              >
                <i className="fas fa-angle-double-left text-xs"></i>
              </button>

              <div className="px-4 flex-1 overflow-y-auto scrollbar-hide">
                <SidebarItem label="Welcome: Data Analyst" icon="cube" caret />
                <SidebarItem label="M0. Fundamentals" icon="cube" caret>
                  <SidebarItem label="Introduzione al mondo dei dati" icon="book" caret>
                    <SidebarItem label="Video" icon="play-circle" caret>
                      <SidebarItem label="1. Intro all'analisi dei dati (1)" icon="play" />
                      <SidebarItem label="2. Intro all'analisi dei dati (2)" icon="play" />
                      <SidebarItem label="3. Analisi dati" icon="play" />
                      <SidebarItem label="4. Gestione dati" icon="play" />
                    </SidebarItem>
                    <SidebarItem label="Teoria" icon="book" caret>
                      <SidebarItem label="Dati 1" icon="file" active />
                    </SidebarItem>
                  </SidebarItem>
                  <SidebarItem label="Figure professionali & Open Da..." icon="book" caret />
                  <SidebarItem label="Business intelligence" icon="book" caret />
                  <SidebarItem label="Excel" icon="book" caret />
                  <SidebarItem label="Esame finale" icon="book" caret />
                </SidebarItem>

                <div className="mt-2">
                  <SidebarItem label="M1. Excel: febbraio 9 - marzo 13" icon="cube" caret />
                  <SidebarItem label="M2: marzo 16 - aprile 17" icon="cube" caret />
                  <SidebarItem label="M3. aprile 20 - maggio 22" icon="cube" caret />
                  <SidebarItem label="M4. Google Looker Studio: maggio..." icon="cube" caret />
                  <SidebarItem label="M5. Power BI: giugno 15 - luglio 17" icon="cube" caret />
                  <SidebarItem label="Capstone Project & Career Training" icon="cube" caret />
                </div>
              </div>
            </aside>
          )}

          {!leftSidebarOpen && (
            <button 
              onClick={() => setLeftSidebarOpen(true)}
              className="p-4 text-[#5c5f73] hover:text-white"
            >
              <i className="fas fa-angle-double-right"></i>
            </button>
          )}

          {/* Main Content */}
          <main className="flex-1 relative overflow-y-auto">
            <div className="flex items-center justify-between px-10 pt-6">
              <div className="flex items-center gap-4">
                <div className="w-[360px]">
                  <div className="relative">
                    <input className="w-full bg-[#121421] border border-[#1e2133] rounded-lg px-4 py-2 pl-10 text-sm text-[#cfd3e3] focus:outline-none" placeholder="Search in course" />
                    <i className="fas fa-search absolute left-3 top-3 text-[#6d7286] text-sm"></i>
                    <span className="absolute right-3 top-2.5 text-xs bg-[#1b1e2b] border border-[#2d3146] text-[#aeb3c4] px-2 py-0.5 rounded">⌘K</span>
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-4 text-[#9aa0b4]">
                <div className="relative">
                  <i className="fas fa-bell"></i>
                  <span className="absolute -top-1 -right-1 w-4 h-4 bg-[#ff4d6d] text-[10px] rounded-full flex items-center justify-center text-white">1</span>
                </div>
                <i className="fas fa-user"></i>
              </div>
            </div>

            <div className="px-10 pt-4">
              <h1 className="text-2xl font-semibold">Dati 1</h1>
            </div>

            <div className="px-10 pt-6">
              <div className="relative w-[820px] h-[420px] rounded-xl border border-[#1d2132] overflow-hidden bg-[#0c0f1f]">
                <div className="absolute inset-0" style={{backgroundImage: "url('https://replicate.delivery/xezq/pxe1AjgYmzxxMSFQNm0wueKbt7jidAHUvOEESMmR1irgu0UWA/out.png')", backgroundSize: 'cover', backgroundPosition: 'center'}}></div>
                <div className="absolute inset-0 bg-gradient-to-br from-[#0c0f1f] via-[#0c0f1f] to-transparent opacity-70"></div>
                <div className="relative z-10 p-8">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="relative w-7 h-7">
                        <span className="absolute w-4 h-4 bg-[#c029d6] skew-x-[-20deg] -left-0"></span>
                        <span className="absolute w-4 h-4 bg-[#8b2dff] skew-x-[-20deg] left-2 top-2"></span>
                        <span className="absolute w-4 h-4 bg-[#ff4da6] skew-x-[-20deg] left-1 top-4"></span>
                      </div>
                      <div className="text-xl font-bold tracking-wide">EPICODE</div>
                    </div>
                    <button className="bg-white text-[#1b1e2b] text-xs font-semibold px-4 py-2 rounded-md shadow">Dati 1 &nbsp; PDF</button>
                  </div>
                  <div className="mt-28">
                    <div className="text-3xl font-semibold leading-tight">Introduzione al mondo dei<br/>Dati</div>
                  </div>
                </div>
                <div className="absolute bottom-6 left-10 right-10">
                  <div className="h-2 bg-white rounded-full relative">
                    <div className="absolute left-0 top-0 h-2 w-6 bg-[#f65f5f] rounded-full"></div>
                    <div className="absolute left-1/2 -translate-x-1/2 -top-1 w-6 h-4 bg-[#d8dbe6] rounded-full border border-[#c5c8d8]"></div>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {/* Right Comments */}
          {rightSidebarOpen ? (
            <aside className="w-[260px] border-l border-[#1b1e2d] bg-[#0c0d17] flex flex-col shrink-0">
              <div className="flex items-center gap-2 px-4 py-4 border-b border-[#1b1e2d]">
                <i className="fas fa-users text-[#c03ad8]"></i>
                <div className="text-sm font-semibold">Comments</div>
                <i className="fas fa-chevron-up text-xs text-[#c03ad8] ml-auto"></i>
              </div>
              <div className="p-4 flex-1">
                <textarea className="w-full border border-[#2a2e45] rounded-lg h-36 bg-transparent text-sm text-[#d8dbe6] p-3 focus:outline-none" placeholder="Leave a comment..."></textarea>
              </div>
              <div className="px-4 pb-6">
                <button className="w-full bg-[#2a2e45] text-[#9aa0b4] py-2 rounded-md text-sm cursor-not-allowed">Submit</button>
              </div>
            </aside>
          ) : (
            <div className="flex flex-col border-l border-[#1b1e2d] bg-[#0c0d17] py-4 px-2">
               <button onClick={() => setRightSidebarOpen(true)} className="text-[#5c5f73] hover:text-white">
                  <i className="fas fa-chevron-left"></i>
               </button>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  </body>
</html>
